<style id="m8-studio-css">
:root{--m8-blue:#525cbb;--m8-blue-soft:rgba(82,92,187,.10)}
.app.structure-open{grid-template-columns:208px 242px minmax(0,1fr) 284px}
.structure-pane{display:none;grid-column:2;grid-row:2;min-width:0;min-height:0;background:var(--panel);border-right:1px solid var(--line);flex-direction:column}
.app.structure-open .structure-pane{display:flex}
.app.structure-open .workspace{grid-column:3}
.app.structure-open .inspector{grid-column:4}
.structure-head{height:58px;min-height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 12px 0 17px;font:600 10px var(--mono);letter-spacing:.055em}
.structure-summary{font:10px/1.5 var(--mono);padding:14px 17px 10px;color:var(--muted)}
.structure-scroll{flex:1;min-height:0;overflow:auto;padding:4px 9px 18px;scrollbar-width:thin}
.structure-row{display:flex;align-items:center;min-width:0;min-height:32px;border-radius:6px;position:relative;margin:1px 0;border:1px solid transparent}
.structure-row:hover{background:var(--m8-blue-soft)}
.structure-row.is-active{background:var(--m8-blue-soft);border-color:rgba(82,92,187,.25)}
.structure-select{flex:1;display:flex;align-items:center;gap:7px;min-width:0;text-align:left;height:29px;padding:3px 5px;border-radius:5px;font-size:11px;color:#555b62}
.structure-row.is-active .structure-select,.structure-row.is-active .structure-select .icon{color:var(--m8-blue);font-weight:600}
.structure-row:hover .structure-select{color:var(--m8-blue)}
.structure-select .icon{width:13px;height:13px;flex:none;color:#8a8e9a}
.structure-label{white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.structure-arrow{width:18px;min-width:18px;height:25px;padding:0;display:grid;place-items:center;color:#858997;border-radius:4px;font-size:11px}
.structure-arrow:hover{background:rgba(82,92,187,.13);color:var(--m8-blue)}
.structure-arrow:focus-visible,.structure-select:focus-visible,.structure-toggle:focus-visible{outline:2px solid var(--m8-blue);outline-offset:-2px}
.structure-footer{border-top:1px solid var(--line);padding:9px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:5px;color:var(--muted);font:9px var(--mono)}
.structure-footer>.btn{flex:1 1 calc(50% - 5px);min-width:0;white-space:nowrap;justify-content:center}
.structure-toggle{font-family:var(--mono);color:var(--m8-blue);border-color:rgba(82,92,187,.3)}
.structure-toggle[aria-pressed="true"]{background:var(--m8-blue-soft)}
.editor-shell .design [data-node-id]:hover:not(:has([data-node-id]:hover)){outline:1px solid var(--m8-blue)!important;outline-offset:-1px}
.editor-shell .design [data-node-id].chosen{outline:2px solid var(--m8-blue)!important;outline-offset:-2px;z-index:3}
.editor-shell .design [data-node-id].chosen:after{background:var(--m8-blue);color:#fff}
.inspector .selection-path{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin:0 0 16px}
.inspector .selection-path button{font:10px var(--mono);color:var(--m8-blue);padding:4px 5px;border-radius:4px}
.inspector .selection-path button:hover{background:var(--m8-blue-soft)}
.inspector .selection-path .sep{color:#9b9da8}
@media(max-width:1280px){.app.structure-open{grid-template-columns:190px 212px minmax(0,1fr) 255px}}
@media(max-width:1060px){.app.structure-open{grid-template-columns:190px minmax(0,1fr) 255px}
  .app.structure-open .structure-pane{position:absolute;left:190px;top:56px;bottom:0;width:230px;z-index:15;box-shadow:8px 12px 32px #0001}
  .app.structure-open .workspace{grid-column:2}.app.structure-open .inspector{grid-column:3}}
@media(max-width:850px){.app.structure-open{grid-template-columns:195px minmax(0,1fr)}
  .app.structure-open .structure-pane{left:195px}.app.structure-open .inspector{grid-column:3}}

/* Dragging a structure row is an authoring operation, not a position edit. */
.structure-handle{width:20px;height:28px;flex:none;display:grid;place-items:center;color:#a2a6b3;cursor:grab;font:15px var(--mono);user-select:none}
.structure-handle:hover{color:var(--m8-blue)}
.structure-handle:active{cursor:grabbing}
.structure-row.drop-before::before,.structure-row.drop-after::after{content:"";height:2px;background:var(--m8-blue);position:absolute;left:8px;right:8px;z-index:2}
.structure-row.drop-before::before{top:-2px}.structure-row.drop-after::after{bottom:-2px}
.structure-row.drop-inside{outline:2px solid var(--m8-blue);outline-offset:-2px;background:var(--m8-blue-soft)}
.structure-row.is-dragging{opacity:.35}

/* Atomic grid-area picker: only Studio chrome, not part of the published tree. */
.area-editor{margin:19px 0;border-top:1px solid var(--line);padding-top:16px}
.area-title{font:600 10px var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:9px}
.area-grid{width:100%;max-height:365px;overflow:auto;display:grid;gap:2px;padding:6px;border-radius:8px;border:1px solid var(--line);background:#f2f3f6;touch-action:none}
.area-grid-cell{aspect-ratio:1;border-radius:3px;border:1px solid #d9dbe5;background:#fff;min-width:0;padding:0;cursor:crosshair;display:block}
.area-grid-cell.is-other{background:#edeef3}
.area-grid-cell.is-selected{background:var(--m8-blue);border-color:var(--m8-blue)}
.area-grid-cell.is-draft{background:var(--m8-blue);border-color:var(--m8-blue)}
.area-grid-cell:hover{outline:2px solid var(--m8-blue);outline-offset:-1px}
.area-values{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:11px}
.area-values label{display:block;font:9px var(--mono);color:#7b7f90}
.area-values input{width:100%;min-width:0;border:1px solid var(--line);border-radius:5px;padding:8px 4px;margin-top:3px;text-align:center;font:12px var(--mono);background:white}
.area-actions{display:flex;gap:7px;align-items:center;justify-content:space-between;margin-top:9px}
.area-error{color:#a54040;font:10px/1.5 var(--mono);min-height:15px}
.area-overlap{color:#373d57;font:10px/1.5 var(--mono);margin:9px 0 0;padding:8px 9px;background:var(--m8-blue-soft);border-radius:5px}
.area-overlap:empty{display:none}
.area-grid-cell.is-overlap{background:repeating-linear-gradient(135deg,var(--m8-blue) 0 4px,#a7ade2 4px 8px);border-color:var(--m8-blue)}
 
/* M8 Structure keyboard actions; all emphasis uses the Studio-only blue. */
.structure-editbar{display:flex;align-items:center;gap:5px;padding:4px 12px 10px;border-bottom:1px solid var(--line)}
.structure-move{border:1px solid rgba(82,92,187,.24);background:var(--panel);color:var(--m8-blue);border-radius:5px;min-width:27px;height:26px;font:600 14px var(--mono);cursor:pointer}
.structure-move:hover:not(:disabled){background:var(--m8-blue-soft);border-color:var(--m8-blue)}
.structure-move:focus-visible{outline:2px solid var(--m8-blue);outline-offset:1px}
.structure-move:disabled{opacity:.28;cursor:default}
.structure-move-hint{margin-left:auto;font:8px var(--mono);letter-spacing:.04em;color:var(--muted)}
</style>

const structureMode=()=>['page','template','component'].includes(ui.section)&&ui.mode==='design';
function structureLabel(n){
 if(n.label)return String(n.label).slice(0,70);
 if(n.type==='card')return n.source?'Collection · '+n.source.collection:n.reference?'Component · '+n.reference:n.variant?'Card · '+n.variant:'Card';
 if(n.type==='text')return (n.text||'Text').replace(/\s+/g,' ').slice(0,42)||'Text';
 if(n.type==='image')return 'Image · '+(n.source||'no source');

}

function findNodePath(id,nodes=currentBlocks(),trail=[]){
 for(const n of nodes){
  const next=[...trail,n];
  if(n.id===id)return next;
  if(n.children){const hit=findNodePath(id,n.children,next);if(hit)return hit}
 }
 return null;
}

 for(const n of path?.slice(0,-1)||[])ui.structureCollapsed.delete(n.id);
 const changed=saveScopeEdit(before,selectedBefore);
 if(changed)requestAnimationFrame(()=>{
   const focus=document.querySelector('#structureTree .structure-select[data-id="'+ui.node+'"]');
   focus?.scrollIntoView({block:'nearest'});focus?.focus();
 });

}

function modifyScoped(scope,obj,target){

  const index=target.collections.findIndex(c=>c.id===ui.collection);
  if(index<0)throw Error('Collection no longer exists');
  target.collections[index]=obj;return target;
 }
 if(scope==='record'){
  const collection=target.collections.find(c=>c.id===ui.collection);
  const index=collection?.records.findIndex(r=>r.id===ui.record)??-1;
  if(index<0)throw Error('Record no longer exists');
  collection.records[index]=obj;return target;
 }
 const key=scope==='page'?'pages':scope==='template'?'templates':scope==='component'?'components':null;
 if(!key)throw Error('Unknown JSON scope: '+scope);
 const id=scope==='page'?ui.page:scope==='template'?ui.template:ui.component;
 const index=target[key].findIndex(row=>row.id===id);
 if(index<0)throw Error('Authored scope no longer exists');
 target[key][index]=obj;return target;

function applyValidatedJSON(scope,obj){

 if(scope==='record')ui.record=obj.id;
 if(scope==='page')ui.page=obj.id;
 if(scope==='template')ui.template=obj.id;
 if(scope==='component')ui.component=obj.id;
 // Importing arbitrary JSON invalidates earlier undo snapshots for this document.
 editorHistory.clear();
 persist();
}

async function runImageImport(files,replaceId=null){
 const allowed=new Set(['image/png','image/jpeg','image/webp','image/gif']);
 if(saveBlocked||!savedRevision)throw Error('Unsaved changes. Export JSON before reloading; uploads are paused.');
 const errors=[];let added=0;
 for(const f of files){
  if(!allowed.has(f.type)){errors.push(`${f.name}: only PNG, JPEG, WebP and GIF are supported`);continue}
  if(f.size>12*1024*1024){errors.push(`${f.name}: exceeds 12 MB`);continue}
  $('#saved').textContent=`UPLOADING IMAGE ${added+1}…`;
  try{
   const response=await fetch('/api/assets?filename='+encodeURIComponent(f.name)+(replaceId?'&replaceId='+encodeURIComponent(replaceId):''),{
    method:'POST',headers:{'Content-Type':f.type,'If-Match':savedRevision},body:f
   }).catch(error=>{markSaveFailure(Error('Upload connection failed; server state is uncertain: '+error.message));throw error});
   const result=await response.json().catch(error=>{markSaveFailure(Error('Upload response is incomplete; server state is uncertain: '+error.message));throw error});
   if(!response.ok){
    const error=Error(result.error||`Upload failed (${response.status})`);
    if(response.status===409||response.status===428)markSaveFailure(error);
    throw error;
   }
   const nextRevision=response.headers.get('etag');
   if(!nextRevision){markSaveFailure(Error('Upload response lacked a file revision'));throw Error('Upload state uncertain: export JSON before reloading');}
   savedRevision=nextRevision;
   if(replaceId){
     const index=db.assets.findIndex(asset=>asset.id===replaceId);
     if(index<0){markSaveFailure(Error('Replaced asset is no longer in the editor; export JSON and reconcile.'));throw Error('Replacement identity mismatch')}
     db.assets[index]=result.asset;
   }else db.assets.push(result.asset);
   ui.asset=result.asset.id;
   added++;
   if(replaceId)break;
  }catch(err){
   errors.push(`${f.name}: ${err.message}`);
   if(saveBlocked)break;
  }
 }
 if(!saveBlocked)$('#saved').textContent=errors.length?'UPLOAD COMPLETED WITH ERRORS':'JSON FILE · SAVED';
 if(added){choose('assets',ui.asset);showInspector()}
 if(errors.length)alert('Could not import:\n'+errors.join('\n'));
}

   const selected=x>=area.x1&&x<area.x2&&y>=area.y1&&y<area.y2;
   const occupied=taken.has(x+':'+y);
   const description='Column '+x+', row '+y+(occupied?' · another object occupies this cell':'');
   cells.push('<button type="button" class="area-grid-cell'+(selected?' is-selected':'')+(occupied?' is-other':'')+(selected&&occupied?' is-overlap':'')+'" data-area-x="'+x+'" data-area-y="'+y+'" title="'+description+'" aria-label="'+description+'" aria-pressed="'+selected+'"></button>');
  }
  grid='<div id="areaGrid" class="area-grid" style="grid-template-columns:repeat('+cols+',minmax(0,1fr));width:min(100%,'+(cols*24+12)+'px)" aria-label="Drag to select a grid rectangle">'+cells.join('')+'</div>';
 }else grid='<p class="help">Large grid · use the four values below and Apply all.</p>';
 const inputs=['x1','y1','x2','y2'].map(k=>'<label>'+k.toUpperCase()+'<input class="control" type="number" step="1" min="1" data-area-value="'+k+'" value="'+area[k]+'"></label>').join('');
 return '<div class="area-editor"><div class="area-title">Grid area in parent · '+cols+' × '+rows+'</div>'+
 '<p class="help">Drag across cells to set a rectangle, or edit all four values and press Apply. No partial invalid saves.</p>'+
 grid+'<p id="areaOverlap" class="area-overlap" role="status" aria-live="polite">'+e(collision)+'</p><div class="area-values">'+inputs+'</div><div class="area-actions"><span id="areaError" class="area-error" role="status"></span><button class="btn sm" data-act="apply-area">Apply all</button></div></div>';
}
function writeAreaDraft(nodeId,area){
 ui.areaDraft={id:nodeId,area};
 paintAreaSelection(area);
 updateAreaCollisionNotice(area);
 for(const key of ['x1','y1','x2','y2']){
  const input=document.querySelector('[data-area-value="'+key+'"]');
  if(input)input.value=area[key];
 }
}
function commitArea(area){
 const found=ui.node?findNode(ui.node):null;
 if(!found?.parent||!validArea(area,found.parent)){
  const status=$('#areaError');if(status)status.textContent='Invalid rectangle for this Card grid';
  return false;
 }
 const before=snapshotScope(),selectedBefore=ui.node;
 found.node.area={...area};ui.areaDraft=null;
 saveScopeEdit(before,selectedBefore);return true;
}
function pointerAreaCell(event){
 const cell=document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-area-x]');
 return cell&&$('#areaGrid')?.contains(cell)?{x:Number(cell.dataset.areaX),y:Number(cell.dataset.areaY)}:null;
}
document.addEventListener('pointerdown',event=>{
 if(event.button!==0)return;
 const cell=event.target.closest('[data-area-x]');
 if(!cell)return;
 const grid=$('#areaGrid');if(!grid)return;
 event.preventDefault();
 const start={x:Number(cell.dataset.areaX),y:Number(cell.dataset.areaY)};
 ui.areaDrag={start,last:start,pointerId:event.pointerId,nodeId:ui.node};
 grid.setPointerCapture(event.pointerId);
 writeAreaDraft(ui.node,areaRect(start,start));
});
document.addEventListener('pointermove',event=>{
 const drag=ui.areaDrag;if(!drag||drag.pointerId!==event.pointerId)return;
 const hit=pointerAreaCell(event);
 if(!hit)return;
 drag.last=hit;
 writeAreaDraft(drag.nodeId,areaRect(drag.start,drag.last));
});
document.addEventListener('pointerup',event=>{
 const drag=ui.areaDrag;if(!drag||drag.pointerId!==event.pointerId)return;
 const hit=pointerAreaCell(event);
 if(hit)drag.last=hit;
 ui.areaDrag=null;
 commitArea(areaRect(drag.start,drag.last));
});
document.addEventListener('pointercancel',()=>{ui.areaDrag=null;ui.areaDraft=null;renderInspector()});

let draggingId=null;
function treeDropMode(row,event){
 const id=row?.dataset.rowId,n=id&&findNode(id)?.node;
 if(!n)return null;
 const r=row.getBoundingClientRect();
 const ratio=(event.clientY-r.top)/Math.max(1,r.height);
 return n.type==='card'&&ratio>=.28&&ratio<=.72?'inside':ratio<.5?'before':'after';
}
function clearTreeDrag(){
 for(const row of document.querySelectorAll('.structure-row')){
  row.classList.remove('drop-before','drop-after','drop-inside','is-dragging');
 }
}
document.addEventListener('dragstart',event=>{
 const handle=event.target.closest('.structure-handle');
 if(!handle||!structureMode())return;
 draggingId=handle.dataset.dragId;
 event.dataTransfer?.setData('text/plain',draggingId);
 if(event.dataTransfer)event.dataTransfer.effectAllowed='move';
 handle.closest('.structure-row')?.classList.add('is-dragging');
});
document.addEventListener('dragover',event=>{
 if(!draggingId)return;
 const row=event.target.closest('.structure-row'),mode=treeDropMode(row,event);
 clearTreeDrag();
 if(!row||!mode)return;
 const trial=moveTreeNode(currentBlocks(),draggingId,row.dataset.rowId,mode);
 if(!trial.ok){if(event.dataTransfer)event.dataTransfer.dropEffect='none';return}
 event.preventDefault();
 if(event.dataTransfer)event.dataTransfer.dropEffect='move';
 row.classList.add('drop-'+mode);
});
document.addEventListener('drop',event=>{
 if(!draggingId)return;
 const row=event.target.closest('.structure-row'),mode=treeDropMode(row,event);
 const id=draggingId;draggingId=null;clearTreeDrag();
 if(!row||!mode)return;
 event.preventDefault();
 const result=moveTreeNode(currentBlocks(),id,row.dataset.rowId,mode);
 if(!result.ok){alert(result.error);return}
 const scope=currentScope(),before=snapshotScope(),selectedBefore=ui.node;
 scope.blocks=result.blocks;ui.node=id;
 if(result.parentId)ui.structureCollapsed.delete(result.parentId);
 saveScopeEdit(before,selectedBefore);
});
document.addEventListener('dragend',()=>{draggingId=null;clearTreeDrag()});

document.addEventListener('click',event=>{let target=event.target.closest('[data-act]');if(target){handleAction(target);return}let n=event.target.closest('[data-node-id]');if(n&&ui.mode==='design'){event.preventDefault();selectStudioNode(n.dataset.nodeId);return}let g=event.target.closest('[data-open-generated]');if(g&&ui.mode!=='design'){event.preventDefault();openRecord(g.dataset.openGenerated,g.dataset.forCollection);return}let nav=event.target.closest('[data-site-route]');if(nav){event.preventDefault();let p=db.pages.find(p=>p.slug===nav.dataset.siteRoute);if(p)choose('page',p.id);return}if(event.target.id==='modalBack')closeModal()});
document.addEventListener('change',event=>{let el=event.target;
 if(el.dataset.cell){let r=recById(ui.collection,el.dataset.id),f=coll()?.fields.find(x=>x.key===el.dataset.key);if(r){setRecordValue(r,el.dataset.key,el.type==='checkbox'?el.checked:el.value,f);persist();queueMicrotask(renderAll)}return}
 if(el.dataset.recordField){let r=rec(),f=coll()?.fields.find(x=>x.key===el.dataset.recordField);
  if(r){
    if(el.dataset.recordField==='projectCode'){
      const candidate=clone(db);
      const target=candidate.collections.find(c=>c.id===ui.collection)?.records.find(x=>x.id===r.id);
      if(!target)return;
      target.projectCode=el.value.trim();
      try{validateSiteData(candidate)}catch(error){alert(error.message);renderAll();return}
      db=candidate;
    }else setRecordValue(r,el.dataset.recordField,el.type==='checkbox'?el.checked:el.value,f);
    persist();queueMicrotask(renderAll);
  }return}
 if(el.dataset.placeholder){
   const target=el.dataset.placeholder==='page'?page():el.dataset.placeholder==='record'?rec():asset();
   if(target){target.placeholder=el.value==='true';persist();renderInspector()}
   return
 }
 if(el.dataset.assetProjectCode){
   const candidate=clone(db),a=candidate.assets.find(a=>a.id===el.dataset.assetProjectCode);
   if(!a)return;
   a.properties||={};a.properties.projectCode=el.value.trim();
   try{validateSiteData(candidate)}catch(error){alert(error.message);renderAll();return}
   db=candidate;persist();renderAll();return
 }
 if(el.dataset.assetCell){let a=db.assets.find(a=>a.id===el.dataset.id);if(a){a[el.dataset.assetCell]=el.dataset.assetCell==='tags'?el.value.split(',').map(x=>x.trim()).filter(Boolean):el.value;persist();renderWork();renderInspector()}return}
 if(el.dataset.assetProp){let a=asset();if(a){if(el.dataset.assetProp==='src'&&String(a.src).startsWith('/assets/uploads/'))return;a[el.dataset.assetProp]=el.dataset.assetProp==='tags'?el.value.split(',').map(x=>x.trim()).filter(Boolean):el.value;persist();renderAll()}return}
 if(el.dataset.customVal){let a=asset();if(a){a.properties[el.dataset.customVal]=el.value;persist()}return}
 if(el.dataset.customKey){let a=asset(),old=el.dataset.customKey,k=el.value.trim();if(a&&k&&!Object.hasOwn(a.properties,k)){a.properties[k]=a.properties[old];delete a.properties[old];persist();renderInspector()}return}
 if(el.dataset.siteIndexing){
  const candidate=clone(db);
  candidate.site.publishing={indexing:el.value==='true'};
  try{validateSiteData(candidate)}
  catch(error){alert(error.message);renderInspector();return}
  db=candidate;persist();renderInspector();return
 }
 if(el.dataset.siteContact){
  const key=el.dataset.siteContact;
  if(key!=='email'&&key!=='bookingUrl')return;
  const candidate=clone(db);
  candidate.site.contact={email:'',bookingUrl:'',...(candidate.site.contact||{}),[key]:el.value.trim()};
  try{validateSiteData(candidate)}
  catch(error){alert(error.message);renderInspector();return}
  db=candidate;persist();renderInspector();return
 }
 if(el.dataset.siteDesign){
    db.site.design||={unitDivisor:100,cardBorders:false};
    const key=el.dataset.siteDesign;
    if(key==='cardBorders')db.site.design.cardBorders=el.value==='true';
    else {
      const [region,field]=key.split('.');
      if(!['header','footer'].includes(region)||!['constrainHeight','heightFactor'].includes(field))return;
      db.site.design.frame||={};
      db.site.design.frame[region]||={constrainHeight:false,heightFactor:0.05};
      if(field==='constrainHeight')db.site.design.frame[region][field]=el.value==='true';
      else {
        const factor=Number(el.value);
        if(!Number.isFinite(factor)||factor<=0||factor>4){alert('Height factor must be between 0 and 4.');return}
        db.site.design.frame[region][field]=factor;
      }
    }
    persist();renderAll();return
 }
 if(['site-pad','site-gap'].includes(el.dataset.nodeProp)){
   const n=Number(el.value);
   if(!Number.isFinite(n)||n<=0||n>4){alert('Master spacing must be between 0 and 4u.');return}
   db.site.design[el.dataset.nodeProp==='site-pad'?'pad':'gap']=n;
   persist();renderAll();return
 }
 if(el.dataset.nodeProp){setNodeField(el.dataset.nodeProp,el.value);return}
 if(el.dataset.formatTemplate){coll().formatTemplates[el.dataset.formatTemplate]=el.value;persist();renderAll();return}
 if(el.dataset.publicationApproval){const target=el.dataset.publicationApproval==='page'?page():rec();if(target){target.approvedForPublication=el.value==='true';persist();renderInspector()}return}
 if(el.dataset.edit){let s=el.dataset.edit==='collection'?coll():el.dataset.edit==='page'?page():el.dataset.edit==='template'?tpl():component();if(s){s[el.dataset.key]=el.value;persist();renderAll()}return}
 if(el.id==='samplePicker'){ui.sample=el.value;renderWork();return}
 if(el.id==='scopePicker'){choose(ui.section,el.value);return}
 if(el.id==='formatFilter'){ui.format=el.value;renderWork();return}
 if(el.id==='recordSearch'||el.id==='assetSearch'){ui.search=el.value;renderWork();return}
 if(el.id==='importFile'&&el.files[0]){el.files[0].text().then(t=>{const d=normalize(JSON.parse(t));validateSiteData(d);if(!confirm('Replace the current Studio JSON with this validated file? Export a backup first if needed.'))return;applyValidatedJSON('all',d);choose('dashboard')}).catch(err=>alert('Import error: '+err.message));el.value='';return}
 if(el.id==='imageFile'){importImages([...el.files]).catch(err=>alert('Image error: '+err.message));el.value='';return}
 if(el.id==='replaceImageFile'){const replaceId=ui.asset;importImages([...el.files],replaceId).catch(err=>alert('Image replacement error: '+err.message));el.value='';return}
});
document.addEventListener('input',event=>{
 const el=event.target;
 if(el.matches('[data-area-value]')){
  const area={};
  for(const key of ['x1','y1','x2','y2'])area[key]=Number(document.querySelector('[data-area-value="'+key+'"]')?.value);
  const found=ui.node?findNode(ui.node):null,valid=validArea(area,found?.parent);
  const status=$('#areaError');
  if(status)status.textContent=valid?'':'Check grid coordinates before applying';
  if(valid)paintAreaSelection(area);
  updateAreaCollisionNotice(valid?area:null);
  return;
 }
 if(el.id==='recordSearch'||el.id==='assetSearch'){ui.search=el.value;/* Commit filter on Enter or blur to avoid interrupting input. */}
});

document.addEventListener('keydown',event=>{
 if(!structureMode()||!(event.ctrlKey||event.metaKey)||event.altKey)return;
 const target=event.target;
 if(target.closest('input,textarea,select,[contenteditable="true"],[role="textbox"]'))return;
 const key=event.key.toLowerCase();
 if(key==='z'||key==='y'){
   if(key==='z'&&!event.shiftKey&&editorHistory.canUndo(historyScope())){
     event.preventDefault();restoreScopeEdit('undo');
   }else if((key==='y'||(key==='z'&&event.shiftKey))&&editorHistory.canRedo(historyScope())){
     event.preventDefault();restoreScopeEdit('redo');
   }
 }
});
document.addEventListener('keydown',event=>{
 const focus=event.target.closest('.structure-select');
 if(!focus||!structureMode())return;
 if(event.altKey&&!event.ctrlKey&&!event.metaKey&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key)){
   event.preventDefault();
   applyTreeMove(({ArrowUp:'up',ArrowDown:'down',ArrowRight:'indent',ArrowLeft:'outdent'})[event.key]);
   return;
 }
 const rows=[...document.querySelectorAll('#structureTree .structure-select')];
 const index=rows.indexOf(focus);
 if(index<0)return;
 const step=event.key==='ArrowDown'?1:event.key==='ArrowUp'?-1:0;
 if(step){
  event.preventDefault();
  const next=rows[Math.max(0,Math.min(rows.length-1,index+step))];
  selectStudioNode(next.dataset.id);
  requestAnimationFrame(()=>document.querySelector('#structureTree .structure-select[data-id="'+next.dataset.id+'"]')?.focus());
  return;
 }
 if(event.key==='ArrowRight'||event.key==='ArrowLeft'){
  event.preventDefault();
  const id=focus.dataset.id,found=findNode(id),foldable=found?.node.type==='card'&&(found.node.children||[]).length;
  if(event.key==='ArrowRight'&&foldable&&ui.structureCollapsed.has(id)){
   ui.structureCollapsed.delete(id);renderStructure();
  }else if(event.key==='ArrowLeft'&&foldable&&!ui.structureCollapsed.has(id)){
   ui.structureCollapsed.add(id);renderStructure();
  }else if(event.key==='ArrowLeft'&&found?.parent){
   selectStudioNode(found.parent.id);
  }else if(event.key==='ArrowRight'&&foldable){
   selectStudioNode(found.node.children[0].id);
  }
  requestAnimationFrame(()=>document.querySelector('#structureTree .structure-select[data-id="'+ui.node+'"]')?.focus());
 }
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeModal();$('#inspector').classList.remove('show');$('#sidebar').classList.remove('show')}if(event.key==='Enter'&&(event.target.id==='recordSearch'||event.target.id==='assetSearch')){event.target.blur();renderWork()}});
function recById(cid,rid){return db.collections.find(c=>c.id===cid)?.records.find(r=>r.id===rid)}
$('#exportBtn').addEventListener('click',exportJSON);$('#reloadBtn').addEventListener('click',reloadSavedFile);$('#importBtn').addEventListener('click',()=>$('#importFile').click());$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('show'));$('#inspectToggle').addEventListener('click',()=>$('#inspector').classList.toggle('show'));$('#inspectClose').addEventListener('click',()=>$('#inspector').classList.remove('show'));
window.__TA_STUDIO__={getData:()=>clone(db),reset:()=>{db=normalize(seed());persist();choose('dashboard')},navigate:choose};
try {
 const response=await fetch('/api/data',{cache:'no-store'});
 if(!response.ok)throw Error('Loading content failed ('+response.status+')');
 const payload=await response.json();
 savedRevision=response.headers.get('etag');
 if(!savedRevision)throw Error('Local server did not provide a file revision');
 db=normalize(payload);
 $('#saved').textContent='JSON FILE · LOADED';
} catch(err){
 $('#saved').textContent='LOAD FAILED';
 document.querySelector('.workbody').textContent='Cannot load JSON. Check the development server console.';
 console.error(err);
 return;
}
renderAll();
})();
</script>
