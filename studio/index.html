="margin-top:20px">JSON stores content and asset metadata; uploaded images live under assets/uploads/ · Back up both files and JSON.</p></div>`}
function valText(v){return Array.isArray(v)?v.join(', '):typeof v==='boolean'?String(v):String(v??'')}
function fieldCell(c,r,f){let v=r[f.key],id=e(r.id),k=e(f.key);if(f.type==='boolean')return `<input type="checkbox" data-cell="1" data-id="${id}" data-key="${k}" ${v?'checked':''} aria-label="${e(f.label)}">`;if(f.type==='select')return `<select class="cell" data-cell="1" data-id="${id}" data-key="${k}">${(f.options||'').split(',').map(x=>x.trim()).concat(!((f.options||'').split(',').map(x=>x.trim()).includes(String(v||'')))?[String(v||'')]:[]).filter(Boolean).map(x=>`<option value="${e(x)}" ${x===v?'selected':''}>${e(x)}</option>`).join('')}</select>`;if(f.type==='asset')return `<select class="cell" data-cell="1" data-id="${id}" data-key="${k}"><option value="">— none —</option>${db.assets.map(a=>`<option value="${e(a.id)}" ${v===a.id?'selected':''}>${e(a.name)}</option>`).join('')}</select>`;return `<input class="cell ${f.key==='title'?'long':''} ${['date','year'].includes(f.key)?'short':''}" data-cell="1" data-id="${id}" data-key="${k}" type="${f.type==='number'?'number':f.type==='date'?'date':'text'}" value="${e(valText(v))}" title="${e(f.label)}" placeholder="—">`}
function collectionView(){let c=coll();if(!c)return '<div class="empty">No collection selected</div>';if(ui.mode==='json')return jsonView(c,'collection');if(ui.mode==='settings')return collectionSettings(c);let filt=c.records.filter(r=>(ui.format==='all'||String(r.format||r.status)===ui.format)&&(!ui.search||Object.values(r).some(x=>valText(x).toLowerCase().includes(ui.search.toLowerCase()))));let fmt=c.formatField?[...new Set(c.records.map(r=>r[c.formatField]).filter(Boolean))]:[];let top=titleBar('COLLECTION / '+c.base,c.name,'Edit records like a spreadsheet. Each row becomes a generated page.',`<button class="btn" data-act="new-field">${ic('add')} Property</button><button class="btn dark" data-act="new-record">${ic('add')} New record</button>`);return `<div class="content-wrap">${top}<div class="table-toolbar"><div class="toolbar-left"><input class="search" id="recordSearch" placeholder="Search records…" value="${e(ui.search)}"><select class="control" id="formatFilter" style="width:auto;min-height:32px;font-size:11px"><option value="all">All ${e(c.name.toLowerCase())}</option>${fmt.map(f=>`<option value="${e(f)}" ${ui.format===f?'selected':''}>${e(f)}s</option>`).join('')}</select></div><div class="toolbar-right"><span class="upper">${filt.length} RECORDS</span></div></div><div class="table-wrap"><table><thead><tr><th style="min-width:190px">NAME / OPEN</th>${c.fields.filter(f=>f.key!=='title'&&f.key!=='body').map(f=>`<th>${e(f.label)}${f.key==='slug'?' ↗':''}</th>`).join('')}<th></th></tr></thead><tbody>${filt.map(r=>`<tr class="${ui.record===r.id?'selected':''}"><td><div class="record-name">${getAsset(r.cover)?`<img class="small-thumb" src="${e(src(getAsset(r.cover)))}" alt="">`:`<span class="record-icon">${ic('page')}</span>`}<input class="cell long" style="font-weight:590;min-width:155px;padding:6px 2px" data-cell="1" data-id="${e(r.id)}" data-key="title" value="${e(r.title||'Untitled')}" aria-label="Title"><button class="btn ghost sm" data-act="open-record" data-id="${e(r.id)}" title="Open page">${ic('external')}</button></div></td>${c.fields.filter(f=>f.key!=='title'&&f.key!=='body').map(f=>`<td>${fieldCell(c,r,f)}</td>`).join('')}<td><button class="btn ghost sm" data-act="open-record" data-id="${e(r.id)}" title="Open generated page">${ic('external')}</button></td></tr>`).join('')}</tbody></table></div><div class="table-foot"><span>${filt.length} rows · changes saved locally</span><button class="btn sm" data-act="new-record">${ic('add')} Add row</button></div></div>`}
function collectionSettings(c){return `<div class="content-wrap">${titleBar('SCHEMA / CONFIGURATION',c.name+' · Settings','Define reusable properties and automatic page routes.',`<button class="btn" data-act="navigate" data-section="collection" data-id="${e(c.id)}">← Table</button>`)}<div class="detail-grid"><div class="detail-card"><h3>Collection settings</h3>${inputField('Collection name',c.name,'collection','name')}${inputField('URL prefix',c.base,'collection','base')}<div class="field"><label>Default template</label><select class="control" data-edit="collection" data-key="defaultTemplate">${db.templates.map(t=>`<option value="${e(t.id)}" ${t.id===c.defaultTemplate?'selected':''}>${e(t.name)}</option>`).join('')}</select></div><div class="field"><label>Format discriminator (optional)</label><select class="control" data-edit="collection" data-key="formatField"><option value="">None</option>${c.fields.map(f=>`<option value="${e(f.key)}" ${f.key===c.formatField?'selected':''}>${e(f.label)}</option>`).join('')}</select></div>${c.formatField?`<div class="upper" style="margin:20px 0 10px">Format → template</div>${(c.fields.find(f=>f.key===c.formatField)?.options||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<div class="field"><label>${e(x)}</label><select class="control" data-format-template="${e(x)}"><option value="">Default</option>${db.templates.map(t=>`<option value="${e(t.id)}" ${t.id===c.formatTemplates?.[x]?'selected':''}>${e(t.name)}</option>`).join('')}</select></div>`).join('')}`:''}</div><div class="detail-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h3 style="margin:0">Properties · ${c.fields.length}</h3><button class="btn sm" data-act="new-field">${ic('add')} Property</button></div>${c.fields.map(f=>`<div style="display:flex;align-items:center;gap:7px;padding:9px 0;border-bottom:1px solid var(--line)"><span style="flex:1"><strong style="font-size:11px;font-weight:570">${e(f.label)}</strong><br><span class="upper">${e(f.key)} · ${e(f.type)}</span></span>${!['title','slug'].includes(f.key)?`<button class="btn ghost sm" data-act="remove-field" data-key="${e(f.key)}">${ic('trash')}</button>`:''}</div>`).join('')}</div></div><div style="margin-top:17px"><button class="btn" data-act="new-template" data-collection="${e(c.id)}">${ic('add')} New template for this collection</button></div></div>`}
function recordView(){let c=coll(),r=rec();if(!r)return `<div class="content-wrap"><div class="empty">Record not found.</div></div>`;if(ui.mode==='json')return jsonView(r,'record');if(ui.mode==='fields')return `<div class="content-wrap">${titleBar('RECORD / PROPERTIES',r.title,'Edit every field without opening the template.',`<button class="btn" data-act="mode" data-mode="preview">Preview page →</button>`)}<div class="detail-grid"><div class="detail-card">${c.fields.filter(f=>f.key!=='body').map(f=>recordFieldHtml(f,r)).join('')}</div><div class="detail-card"><h3>Body / content</h3>${recordFieldHtml(c.fields.find(f=>f.key==='body')||F('body','Body','textarea'),r)}<p class="help">Markdown headings, paragraphs and lists are supported in the preview. The template controls where the body appears.</p></div></div></div>`;let t=templateFor(c,r);return `<div class="editor-shell"><div class="editor-meta"><div><h1>${e(r.title)}</h1><small>${e(c.base+'/'+r.slug)} · ${e(t?.name||'No template')}</small></div><div class="editor-tools"><button class="btn sm" data-act="mode" data-mode="fields">Edit record</button><button class="btn sm" data-act="edit-template" data-id="${e(t?.id||'')}">Edit template ↗</button></div></div>${siteFrame(renderBlocks(t?.blocks||[],r,false))}<div class="add-area"><button class="btn" data-act="mode" data-mode="fields">${ic('settings')} Edit content and properties</button></div></div>`}
function templateFor(c,r){let id=c?.formatTemplates?.[r?.[c.formatField]]||c?.defaultTemplate;return db.templates.find(t=>t.id===id)||db.templates[0]}
// Shared rendering contract: the preview and the published build import the same module.
function renderBlocks(blocks,ctx=null,design=false){return renderSharedBlocks(blocks,ctx,db,{design,selectedId:ui.node})}
function siteFrame(content,design=false){let route='/';if(ui.section==='record'){const c=coll(),r=rec();if(c&&r)route=c.base+'/'+r.slug+'/'}else if(ui.section==='page')route=page()?.slug||'/';else if(ui.section==='template'){const c=db.collections.find(c=>c.id===tpl()?.collection),r=c?.records.find(r=>r.id===ui.sample);if(c&&r)route=c.base+'/'+r.slug+'/'}return renderSiteFrame(content,db,{design,route})}
function designView(){let isT=ui.section==='template',isC=ui.section==='component',s=currentScope();if(!s)return `<div class="content-wrap"><div class="empty">Nothing selected.</div></div>`;if(ui.mode==='json')return jsonView(s,ui.section);let context=null;if(isT){let c=db.collections.find(c=>c.id===s.collection);context=c?.records.find(r=>r.id===ui.sample)||c?.records[0];}let design=ui.mode==='design';let pick=isT?db.templates:isC?db.components:db.pages;let modeText=isT?'TEMPLATE':isC?'COMPONENT':'CUSTOM PAGE';return `<div class="editor-shell"><div class="editor-meta"><div><div class="upper" style="margin-bottom:6px">${modeText} / ${isT?'AUTO GENERATED':isC?'REUSABLE':'UNIQUE'}</div><h1>${e(s.name||s.title)}</h1><small>${e(isT?db.collections.find(c=>c.id===s.collection)?.base+'/{slug}':isC?'Any page / template':s.slug)} · ${s.blocks.length} root objects</small></div><div class="editor-tools">${isT?`<select class="control" id="samplePicker" style="max-width:160px;font-size:11px" title="Preview with record">${(db.collections.find(c=>c.id===s.collection)?.records||[]).map(r=>`<option value="${e(r.id)}" ${context?.id===r.id?'selected':''}>${e(r.title)}</option>`).join('')}</select>`:''}${isT||isC?`<select class="control" id="scopePicker" style="max-width:160px;font-size:11px">${pick.map(x=>`<option value="${e(x.id)}" ${x.id===s.id?'selected':''}>${e(x.name||x.title)}</option>`).join('')}</select><button class="btn sm" data-act="new-${isT?'template':'component'}">${ic('add')}</button>`:''}</div></div>${siteFrame(renderBlocks(s.blocks,context,design),design)}${design?`<div class="add-area"><button class="btn" data-act="show-blocks" data-inside="no">${ic('add')} Add section / object</button></div>`:''}${!isC?`<div class="help" style="margin:17px 3px">${isT?'Bound values like {{title}} resolve against the selected sample record. Editing the template changes every generated page using it.':'All repeatable content comes from Collections. Query blocks display matching records using a shared component.'}</div>`:''}</div>`}
function recordFieldHtml(f,r){let v=r[f.key],k=e(f.key);if(f.type==='boolean')return `<div class="field" style="display:flex;align-items:center;gap:8px"><input type="checkbox" data-record-field="${k}" ${v?'checked':''} id="fld_${k}"><label for="fld_${k}" style="margin:0">${e(f.label)}</label></div>`;if(f.type==='select')return `<div class="field"><label>${e(f.label)}</label><select class="control" data-record-field="${k}">${(f.options||'').split(',').map(x=>x.trim()).map(x=>`<option value="${e(x)}" ${v===x?'selected':''}>${e(x)}</option>`).join('')}</select></div>`;if(f.type==='asset')return `<div class="field"><label>${e(f.label)}</label><select class="control" data-record-field="${k}"><option value="">— no image —</option>${db.assets.map(a=>`<option value="${e(a.id)}" ${v===a.id?'selected':''}>${e(a.name)}</option>`).join('')}</select></div>`;if(f.type==='textarea')return `<div class="field"><label>${e(f.label)}</label><textarea class="control tall" data-record-field="${k}" rows="${f.key==='body'?'13':'4'}">${e(valText(v))}</textarea></div>`;return `<div class="field"><label>${e(f.label)}</label><input class="control" data-record-field="${k}" type="${f.type==='date'?'date':f.type==='number'?'number':'text'}" value="${e(valText(v))}"></div>`}
function inputField(label,val,scope,key,type='text'){return `<div class="field"><label>${e(label)}</label><input class="control" data-edit="${e(scope)}" data-key="${e(key)}" type="${type}" value="${e(valText(val))}"></div>`}
function assetView(){if(ui.mode==='json')return jsonView(db.assets,'assets');let assets=db.assets.filter(a=>!ui.search||(a.name+' '+a.tags.join(' ')).toLowerCase().includes(ui.search.toLowerCase()));if(ui.mode==='table')return `<div class="content-wrap">${titleBar('LIBRARY / ASSETS','Image properties','Files are stored separately from editable image metadata.',`<button class="btn dark" data-act="upload">${ic('add')} Upload</button>`)}<div class="table-wrap"><table><thead><tr><th>IMAGE</th><th>NAME</th><th>ALT TEXT</th><th>CAPTION</th><th>CREDIT</th><th>TAGS</th></tr></thead><tbody>${assets.map(a=>`<tr><td><button data-act="asset-select" data-id="${e(a.id)}"><img class="small-thumb" src="${e(src(a))}" alt=""></button></td>${['name','alt','caption','credit','tags'].map(k=>`<td><input class="cell long" data-asset-cell="${k}" data-id="${e(a.id)}" value="${e(valText(a[k]))}"></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;return `<div class="content-wrap">${titleBar('LIBRARY / ASSETS','Image library','Uploaded image files, descriptions, captions, tags and custom properties.',`<button class="btn" data-act="new-asset">${ic('add')} Reference</button><button class="btn dark" data-act="upload">${ic('add')} Upload image</button>`)}<div class="table-toolbar"><input class="search" id="assetSearch" placeholder="Search images and tags…" value="${e(ui.search)}"><span class="upper">${assets.length} ASSETS · PNG / JPEG / WEBP / GIF · MAX 12 MB</span></div><div class="asset-grid">${assets.map(a=>`<button class="asset-card ${ui.asset===a.id?'selected':''}" data-act="asset-select" data-id="${e(a.id)}"><img src="${e(src(a))}" alt="${e(a.alt||'')}"><div class="asset-info"><strong>${e(a.name)}</strong><small>${e(a.tags.join(' / '))}</small></div></button>`).join('')}</div></div>`}
function jsonView(data,scope){return `<div class="content-wrap">${titleBar('SOURCE / STRUCTURED DATA',scope==='all'?'Site JSON':'JSON · '+scope,'Direct source editing. Apply validated JSON to update the visual views.',`<button class="btn" data-act="export">${ic('external')} Export all</button>`)}<textarea class="file-json" spellcheck="false" id="jsonEditor">${e(JSON.stringify(data,null,2))}</textarea><div class="json-controls"><button class="btn dark" data-act="apply-json" data-scope="${e(scope)}">Apply JSON</button><button class="btn" data-act="copy-json">Copy</button><span class="notice ${ui.jsonMessage.startsWith('Error')?'error':'ok'}" id="jsonNotice">${e(ui.jsonMessage)}</span></div></div>`}
function treeRows(blocks=currentBlocks(),depth=0){return (blocks||[]).map(n=>`<button class="tree-row ${ui.node===n.id?'active':''}" data-act="select-node" data-id="${e(n.id)}" style="padding-left:${7+depth*13}px">${ic(n.type==='card'?'template':n.type==='query'?'table':n.type==='component'?'blocks':'text')}<span>${e(n.type==='text'?n.text.slice(0,34):n.type==='component'?'Component: '+n.component:n.type==='query'?'Query: '+n.collection:n.type)}</span></button>${n.children?treeRows(n.children,depth+1):''}`).join('')}
function optionsHtml(options,value){return options.map(([v,label])=>`<option value="${e(v)}" ${String(v)===String(value)?'selected':''}>${e(label)}</option>`).join('')}
function nodeField(label,key,value,choices=null,multiline=false){if(choices)return `<div class="field"><label>${label}</label><select class="control" data-node-prop="${e(key)}">${optionsHtml(choices,value)}</select></div>`;return `<div class="field"><label>${label}</label>${multiline?`<textarea rows="5" class="control tall ${key==='source'?'mono':''}" data-node-prop="${e(key)}">${e(value)}</textarea>`:`<input class="control" data-node-prop="${e(key)}" value="${e(valText(value))}">`}</div>`}
function inspectorEmpty(title,desc){return `<h2 class="info-title">${e(title)}</h2><p class="info-sub">${e(desc)}</p>`}
function renderInspector(){let h='';if(ui.section==='dashboard'||ui.section==='data'){h=inspectorEmpty('How it works','One JSON document contains collections, records, templates, components, pages and assets.')+'<div class="rule"></div><p class="help">Changes save to content/site.json through the local Node server. Export JSON remains an optional backup.</p>'}
else if(ui.section==='collection'){let c=coll();h=inspectorEmpty('Collection · '+c.name,'Each record is an auto-generated page under '+c.base+'/')+`<div class="rule"></div><div class="upper">SCHEMA</div><div style="margin:14px 0">${c.fields.map(f=>`<div class="panel-row" style="padding:7px 0;border:0"><span>${e(f.label)}</span><span class="summary">${e(f.type)}</span></div>`).join('')}</div><button class="btn" data-act="mode" data-mode="settings">${ic('settings')} Configure fields</button><div class="rule"></div><div class="upper">GENERATED ROUTES</div><div style="margin-top:12px">${c.records.slice(0,8).map(r=>`<button class="tree-row" data-act="open-record" data-id="${e(r.id)}">${ic('page')}<span>${e(c.base+'/'+r.slug)}</span></button>`).join('')}</div>`}
else if(ui.section==='record'){let r=rec(),c=coll();if(r){h=inspectorEmpty(r.title,`${c.base}/${r.slug}`)+`<div class="upper">GENERATED PAGE</div><div style="margin:10px 0 19px"><span class="badge purple">${e(r.format||r.category||'Record')}</span> <span class="badge">${e(r.status||'Draft')}</span></div><div class="field"><label>Template applied</label><div class="control">${e(templateFor(c,r)?.name||'Missing template')}</div></div><div class="rule"></div>${c.fields.filter(f=>!['body','summary'].includes(f.key)).map(f=>recordFieldHtml(f,r)).join('')}<button class="btn" data-act="duplicate-record">${ic('duplicate')} Duplicate</button><div class="rule"></div><button class="btn" data-act="delete-record">${ic('trash')} Delete record</button>`}}
else if(ui.section==='assets'){let a=asset();h=a?inspectorEmpty(a.name,'Asset / '+a.id)+`<img class="asset-large" src="${e(src(a))}" alt="${e(a.alt||'')}">${['name','src','alt','caption','credit','tags'].map(k=>{let html=nodeField(k==='src'?'Image file / URL':k[0].toUpperCase()+k.slice(1),k,a[k],null,k==='alt'||k==='caption');if(k==='src'&&String(a.src).startsWith('/assets/uploads/'))html=html.replace('data-node-prop="src"','data-node-prop="src" readonly title="Stored file path (read-only)"');return html.replaceAll('data-node-prop','data-asset-prop')}).join('')}<div class="rule"></div><div class="upper" style="margin-bottom:9px">CUSTOM PROPERTIES</div>${Object.entries(a.properties||{}).map(([k,v])=>`<div class="custom-row"><input value="${e(k)}" data-custom-key="${e(k)}"><input value="${e(valText(v))}" data-custom-val="${e(k)}"><button class="btn ghost sm" data-act="remove-custom" data-key="${e(k)}">×</button></div>`).join('')}<button class="btn sm" data-act="add-custom">${ic('add')} Property</button><div class="rule"></div><button class="btn sm" data-act="delete-asset">${ic('trash')} Delete asset</button>`:inspectorEmpty('Asset properties','Select an image to inspect its metadata.')}
else if(['page','template','component'].includes(ui.section)){let scope=currentScope(),found=ui.node?findNode(ui.node):null;if(!found){h=inspectorEmpty(scope?.name||scope?.title||'Page','Select an object on the canvas or from the structure below to edit it.');if(ui.section==='page'){h+=inputField('Page title',scope.title,'page','title')+inputField('URL route',scope.slug,'page','slug')+`<div class="rule"></div><div class="upper">GLOBAL CARD DISPLAY</div><div class="field"><label>Card borders</label><select class="control" data-site-design="cardBorders"><option value="false" ${db.site.design?.cardBorders?'':'selected'}>Off (individual borders still work)</option><option value="true" ${db.site.design?.cardBorders?'selected':''}>On · outline all Cards</option></select></div>`}else if(ui.section==='template'){h+=inputField('Template name',scope.name,'template','name')+'<div class="field"><label>Collection</label><select class="control" data-edit="template" data-key="collection">'+optionsHtml(db.collections.map(c=>[c.id,c.name]),scope.collection)+'</select></div>'}else h+=inputField('Component name',scope.name,'component','name');h+=`<div class="rule"></div><div style="display:flex;align-items:center;justify-content:space-between"><span class="upper">STRUCTURE</span><button class="btn ghost sm" data-act="show-blocks" data-inside="no">${ic('add')}</button></div><div class="structure">${treeRows()}</div><div class="rule"></div><button class="btn" data-act="show-blocks" data-inside="no">${ic('add')} Add object</button>`;if(ui.section!=='page')h+=`<div class="rule"></div><button class="btn sm" data-act="delete-scope">${ic('trash')} Delete ${ui.section}</button>`}

function insertNode(type){
 let n=makeBlock(type),parent=ui.draftSection&&findNode(ui.node)?.node;
 if(parent?.type==='card'){
   const arr=parent.children||(parent.children=[]);let taken=new Set();
   for(const child of arr){const a=child.area;if(a)for(let y=a.y1;y<a.y2;y++)for(let x=a.x1;x<a.x2;x++)taken.add(x+':'+y);}
   let x=1,y=1;
   outer:for(let row=1;row<=parent.rows;row++)for(let col=1;col<=parent.columns;col++)if(!taken.has(col+':'+row)){x=col;y=row;break outer;}
   if(taken.has(x+':'+y)){parent.rows+=1;x=1;y=parent.rows;}
   n.area={x1:x,y1:y,x2:x+1,y2:y+1};arr.push(n);
 } else {
   // Page/template root sections are always Cards.
   if(n.type!=='card')n=card([n],'stack','clear','none');
   currentBlocks().push(n);
 }
 ui.node=n.id;closeModal();persist();renderAll();
 document.querySelector('.block.chosen')?.scrollIntoView({block:'center',behavior:'smooth'});showInspector();
}
function moveNode(delta){let f=findNode(ui.node);if(!f)return;let j=f.index+delta;if(j<0||j>=f.arr.length)return;[f.arr[f.index],f.arr[j]]=[f.arr[j],f.arr[f.index]];persist();renderAll()}
function setNodeField(key,value){
 let f=findNode(ui.node);if(!f)return;
 const n=f.node;
 if(key.startsWith('area.')){
   if(!f.parent||f.parent.type!=='card')return;
   const coord=key.slice(5),next={...(n.area||{x1:1,y1:1,x2:2,y2:2}),[coord]:Number(value)};
   if(![next.x1,next.y1,next.x2,next.y2].every(Number.isInteger)||next.x1<1||next.y1<1||next.x2<=next.x1||next.y2<=next.y1||next.x2>f.parent.columns+1||next.y2>f.parent.rows+1){alert('Grid area must fit the parent Card divisions, using x1 < x2 and y1 < y2.');renderInspector();return;}
   n.area=next;
 } else if(['columns','rows'].includes(key)){
   const num=Number(value);
   if(!Number.isInteger(num)||num<1||num>64){alert('Grid divisions must be whole numbers from 1 to 64.');return;}
   const cols=key==='columns'?num:n.columns,rows=key==='rows'?num:n.rows;
   if((n.children||[]).some(c=>c.area && (c.area.x2>cols+1||c.area.y2>rows+1))){alert('Move existing children inside the new grid first.');renderInspector();return;}
   n[key]=num;
 } else if(key==='heightFactor'){
   const factor=Number(value);if(!Number.isFinite(factor)||factor<=0||factor>4){alert('Height factor must be greater than 0 and at most 4.');return;}n[key]=factor;
 } else if(['border','constrainHeight','caption'].includes(key))n[key]=value==='true';
 else if(key==='count')n[key]=Math.max(1,Number(value)||1);
 else n[key]=value;
 persist();renderAll();
}

async function importImages(files){
 const allowed=new Set(['image/png','image/jpeg','image/webp','image/gif']);
 await saveQueue;
 if($('#saved').textContent.includes('FAILED'))throw Error('Save the pending edits before uploading assets.');
 const errors=[];let added=0;
 for(const f of files){
  if(!allowed.has(f.type)){errors.push(`${f.name}: only PNG, JPEG, WebP and GIF are supported`);continue}
  if(f.size>12*1024*1024){errors.push(`${f.name}: exceeds 12 MB`);continue}
  $('#saved').textContent=`UPLOADING IMAGE ${added+1}…`;
  try{
   const response=await fetch('/api/assets?filename='+encodeURIComponent(f.name),{method:'POST',headers:{'Content-Type':f.type},body:f});
   const result=await response.json();
   if(!response.ok)throw Error(result.error||`Upload failed (${response.status})`);
   db.assets.push(result.asset);
   ui.asset=result.asset.id;
   added++;
  }catch(err){errors.push(`${f.name}: ${err.message}`)}
 }
 $('#saved').textContent=errors.length?'UPLOAD COMPLETED WITH ERRORS':'JSON FILE · SAVED';
 if(added){choose('assets',ui.asset);showInspector()}
 if(errors.length)alert('Could not import:\n'+errors.join('\n'));
}
